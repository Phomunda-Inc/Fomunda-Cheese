<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183c32" />
    <title>Admin login | Phomunda Inc.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="topline">
      <span>PHOMUNDA INC. / INTERNAL</span><a href="/">Return to the public site</a>
    </div>
    <main id="main" class="admin-shell login-shell">
      <header class="admin-header">
        <a class="wordmark" href="/" aria-label="Phomunda Inc home">phomunda<span>INC.</span></a>
        <span class="workspace-label">ADMIN ACCESS</span>
      </header>
      <section class="welcome" aria-labelledby="login-title">
        <p class="eyebrow">THE BACK OFFICE</p>
        <h1 id="login-title">Welcome back.</h1>
        <p>Sign in to the Phomunda administration workspace.</p>
      </section>
      <form class="flag-card login-form" action="/admin/login" method="post">
        <input type="hidden" name="csrf" value="{{csrf}}" />
        <p class="login-error" role="alert">{{error}}</p>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" maxlength="120" required />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          maxlength="1024"
          required
        />
        <button class="admin-button" type="submit">
          Sign in <span aria-hidden="true">&rarr;</span>
        </button>
        <p class="card-note">Authorized personnel only.</p>
      </form>
      <footer class="admin-footer">
        <span>Phomunda Inc. / Internal workspace</span><a href="/">Back to Phomunda Inc.</a>
      </footer>
    </main>
  </body>
</html>
